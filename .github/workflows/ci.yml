name: ci

# Actions minutes are limited (macOS bills 10x, Windows 2x). Only main is pushed (dev -> main);
# that runs Linux only. The full 3-OS matrix runs on pull requests and on demand
# (`gh workflow run ci.yml -f full=true`).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: run macOS and Windows too
        type: boolean
        default: true
      sea:
        description: build the single-file binaries for the 5 targets (publishes nothing)
        type: boolean
        default: false

permissions:
  contents: read

env:
  # The exact Node the SEA binaries embed (Spike S1: node:sqlite is young, so releases pin it).
  NODE_VERSION: 24.22.1

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: ${{ (github.event_name == 'pull_request' || inputs.full) && fromJSON('["macos-latest","ubuntu-latest","windows-latest"]') || fromJSON('["ubuntu-latest"]') }}
    env:
      # Opt in to the platform package's real OS-keyring round trip (a throwaway account, deleted
      # afterwards). It only runs on CI runners: macOS login Keychain, Windows Credential Manager,
      # and on Linux the gnome-keyring below. Never set this on a developer machine.
      AGENT_VAULT_TEST_REAL_KEYRING: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm i --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: test
        if: runner.os != 'Linux'
        run: pnpm test
      # Linux needs a Secret Service on a session bus (Spike S1). The keyring password MUST be
      # non-empty: with an empty one no usable default collection appears and every call fails
      # with "Secret Service: no result found". Tests must run inside the same dbus-run-session.
      - name: test (Linux, Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
          dbus-run-session -- sh -c '
            echo -n "ci-keyring-pass" | gnome-keyring-daemon --unlock --components=secrets
            pnpm test
          '

  # Builds the single-file CLI (Node SEA) for the five targets and runs `agent-vault status` on
  # each. It publishes nothing: no npm, no GitHub release; the binaries stay as artifacts.
  sea:
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.sea }}
    name: sea (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-latest, target: win32-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Runner is the target and Node is the pin
        run: |
          test "$(node -p 'process.platform + "-" + process.arch')" = "${{ matrix.target }}"
          test "$(node -v)" = "v$NODE_VERSION"
      - run: pnpm i --frozen-lockfile
      - run: pnpm dist
      - name: Build smoke test
        env:
          AGENT_VAULT_TEST_SEA: "1"
          # `pnpm dist` above built it; the test only runs it.
          AGENT_VAULT_SEA_PREBUILT: "1"
        run: pnpm vitest run test/e2e/sea.test.ts

      # A temp vault with the keyfile store, so no keychain or Secret Service is needed. `status`
      # starts the daemon from the binary itself, so this also proves the self-spawn.
      - name: agent-vault status
        run: |
          bin="dist-sea/${{ matrix.target }}/agent-vault"
          if [ "$RUNNER_OS" = Windows ]; then bin="$bin.exe"; fi
          export AGENT_VAULT_HOME="$RUNNER_TEMP/av-home"
          export AGENT_VAULT_KEYFILE_PASSPHRASE="release smoke passphrase"
          mkdir -p "$AGENT_VAULT_HOME"
          echo '{"keystore":"keyfile"}' > "$AGENT_VAULT_HOME/config.json"
          "$bin" --version
          "$bin" status | tee status.log
          grep -E '^initialized +no$' status.log
          "$bin" daemon stop

      - name: Package
        run: tar -czf "agent-vault-${{ matrix.target }}.tar.gz" -C dist-sea "${{ matrix.target }}"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-vault-${{ matrix.target }}
          path: agent-vault-${{ matrix.target }}.tar.gz
          if-no-files-found: error
