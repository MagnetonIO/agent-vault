name: spike-s1

on:
  push:
    paths:
      - "spikes/s1-packaging/**"
      - ".github/workflows/spike-s1.yml"
  workflow_dispatch:

jobs:
  s1:
    name: s1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: spikes/s1-packaging
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run plain node + SEA binary (macOS, Windows)
        if: runner.os != 'Linux'
        run: |
          node dist/main.cjs | tee plain.log
          ./dist/s1-spike | tee sea.log
          tail -n 1 plain.log | grep -qx OK
          tail -n 1 sea.log | grep -qx OK

      # Linux needs a Secret Service on a session bus. dbus-run-session starts a private bus;
      # `gnome-keyring-daemon --unlock` reads the login password from stdin, creates and unlocks
      # the login keyring, and daemonizes onto that bus. The password MUST be non-empty: with an
      # empty one (`echo -n ""`) no usable default collection appears and every call fails with
      # "Secret Service: no result found".
      - name: Run plain node + SEA binary (Linux, Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
          dbus-run-session -- sh -c '
            echo -n "ci-keyring-pass" | gnome-keyring-daemon --unlock --components=secrets
            node dist/main.cjs | tee plain.log
            ./dist/s1-spike | tee sea.log
          '
          tail -n 1 plain.log | grep -qx OK
          tail -n 1 sea.log | grep -qx OK

      # Pin evidence, two distinct failure modes (the pinned Entry must throw, never fall back).
      # 1. Locked keyring: a bus exists (libdbus autolaunches one because dbus-x11 is installed)
      #    but its keyring is not unlocked.
      - name: Pin check, locked keyring (Linux, must fail)
        if: runner.os == 'Linux'
        run: |
          if ./dist/s1-spike | tee pin-locked.log; then
            echo "expected failure: pinned entry succeeded on a locked keyring" >&2
            exit 1
          fi
          grep "keyring: FAIL" pin-locked.log

      # 2. No bus at all: the address points nowhere, so libdbus has nothing to connect to and
      #    no autolaunch. Pinned must fail; the unpinned control (SPIKE_NO_PIN=1) shows what the
      #    pin prevents, i.e. whether it silently succeeds through the kernel keyutils keyring.
      - name: Pin check, no bus (Linux, pinned must fail)
        if: runner.os == 'Linux'
        run: |
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent
          if ./dist/s1-spike | tee pin-nobus.log; then
            echo "expected failure: pinned entry succeeded without a bus" >&2
            exit 1
          fi
          grep "keyring: FAIL" pin-nobus.log

      - name: Pin control, no bus, no pin (Linux, observe)
        if: runner.os == 'Linux'
        run: |
          export DBUS_SESSION_BUS_ADDRESS=unix:path=/nonexistent
          SPIKE_NO_PIN=1 ./dist/s1-spike | tee nopin-nobus.log || echo "CONTROL RESULT: failed"
          tail -n 1 nopin-nobus.log | grep -qx OK && echo "CONTROL RESULT: succeeded"
          cat /proc/keys | head -5 || true
