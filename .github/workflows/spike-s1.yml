name: spike-s1

on:
  push:
    paths:
      - "spikes/s1-packaging/**"
      - ".github/workflows/spike-s1.yml"
  workflow_dispatch:

jobs:
  s1:
    name: s1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: spikes/s1-packaging
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run plain node + SEA binary (macOS, Windows)
        if: runner.os != 'Linux'
        run: |
          node dist/main.cjs | tee plain.log
          ./dist/s1-spike | tee sea.log
          tail -n 1 plain.log | grep -qx OK
          tail -n 1 sea.log | grep -qx OK

      - name: Linux keyring variants (debug)
        if: runner.os == 'Linux'
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11 libsecret-tools
          gnome-keyring-daemon --version
          echo "=== A: --unlock only"
          dbus-run-session -- sh -c 'echo -n "" | gnome-keyring-daemon --unlock; ./dist/s1-spike' || echo "A FAILED"
          echo "=== B: --unlock --components=secrets"
          dbus-run-session -- sh -c 'echo -n "" | gnome-keyring-daemon --unlock --components=secrets; ./dist/s1-spike' || echo "B FAILED"
          echo "=== C: --daemonize --login --components=secrets"
          dbus-run-session -- sh -c 'eval $(echo -n "" | gnome-keyring-daemon --daemonize --login --components=secrets); export GNOME_KEYRING_CONTROL; ./dist/s1-spike' || echo "C FAILED"
          echo "=== D: --unlock then --start, with secret-tool primer"
          dbus-run-session -- sh -c 'echo -n "" | gnome-keyring-daemon --unlock --components=secrets; echo x | secret-tool store --label=primer a b; ./dist/s1-spike' || echo "D FAILED"
          echo "=== E: nonempty password"
          dbus-run-session -- sh -c 'echo -n "ci-pass" | gnome-keyring-daemon --unlock --components=secrets; ./dist/s1-spike' || echo "E FAILED"
