name: spike-s1

on:
  push:
    paths:
      - "spikes/s1-packaging/**"
      - ".github/workflows/spike-s1.yml"
  workflow_dispatch:

jobs:
  s1:
    name: s1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: spikes/s1-packaging
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Run plain node + SEA binary (macOS, Windows)
        if: runner.os != 'Linux'
        run: |
          node dist/main.cjs | tee plain.log
          ./dist/s1-spike | tee sea.log
          tail -n 1 plain.log | grep -qx OK
          tail -n 1 sea.log | grep -qx OK

      # Linux needs a Secret Service on a session bus. dbus-run-session starts a private bus;
      # `gnome-keyring-daemon --unlock` reads the (empty) login password from stdin, creates
      # and unlocks the login keyring, and daemonizes onto that bus.
      - name: Run plain node + SEA binary (Linux, Secret Service)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
          dbus-run-session -- sh -c '
            echo -n "" | gnome-keyring-daemon --unlock
            node dist/main.cjs | tee plain.log
            ./dist/s1-spike | tee sea.log
          '
          tail -n 1 plain.log | grep -qx OK
          tail -n 1 sea.log | grep -qx OK
